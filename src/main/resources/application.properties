spring.application.name=aurapay
server.port=${PORT:8080}

# Persistent PostgreSQL storage is configured through Render environment variables.
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=3

# Admin token protects QR uploads and manual UPI claim reconciliation endpoints.
# Set AURAPAY_QR_ADMIN_TOKEN only in Render's Environment settings; never commit its value.
aurapay.qr-admin-token=${AURAPAY_QR_ADMIN_TOKEN:}

# Test-only payment prototype: no real payment processing or automatic wallet crediting.
